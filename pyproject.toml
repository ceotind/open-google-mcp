[project]
name = "open-google-mcp"
version = "0.1.0"
description = "Read-only MCP server for Google Ads (GAQL) and Search Console"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sharp Digital" },
]
keywords = ["mcp", "google-ads", "search-console", "gsc", "gaql", "marketing"]
dependencies = [
    "mcp>=1.0.0",
    "google-ads>=25.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "platformdirs>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/ceotind/open-google-mcp"
Repository = "https://github.com/ceotind/open-google-mcp"

[project.scripts]
open-google-mcp = "open_google_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
