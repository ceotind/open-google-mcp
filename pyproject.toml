[project]
name = "open-google-mcp"
version = "0.2.2"
description = "Read-only MCP server for Google Ads (GAQL), Search Console, Google Analytics 4, and Bing Webmaster Tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sharp Digital" },
]
keywords = ["mcp", "google-ads", "search-console", "gsc", "gaql", "ga4", "analytics", "bing", "bing-webmaster", "seo", "marketing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=1.28.1,<2.0.0",
    "google-ads>=31.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-analytics-data>=0.18.0",
    "google-analytics-admin>=0.30.0",
    "platformdirs>=3.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/ceotind/open-google-mcp"
Repository = "https://github.com/ceotind/open-google-mcp"
Issues = "https://github.com/ceotind/open-google-mcp/issues"

[project.scripts]
open-google-mcp = "open_google_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
